<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title (VERY IMPORTANT for SEO) -->
    <title>Seva Infrastructure | Construction & Development Services</title>

    <!-- SEO Meta -->
    <meta name="description" content="Seva Infrastructure provides high-quality construction, development, and infrastructure services with reliability and excellence." />
    <meta name="keywords" content="Seva Infrastructure, construction company, infrastructure services, building, development" />
    <meta name="author" content="Seva Infrastructure" />

    <!-- Favicon / Logo -->
<link rel="icon" type="image/png" href="/logo.png" />
<link rel="apple-touch-icon" href="/logo.png" />
    <!-- Open Graph (for WhatsApp, Facebook sharing) -->
    <meta property="og:title" content="Seva Infrastructure" />
    <meta property="og:description" content="Reliable construction and infrastructure services you can trust." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Seva Infrastructure" />
    <meta name="twitter:description" content="High-quality infrastructure and construction services." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Theme Color (mobile browser top color) -->
    <meta name="theme-color" content="#ffffff" />
  </head>

  <body>
    <div id="root"></div>

    <!-- React App -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
